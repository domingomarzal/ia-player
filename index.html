<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Reproductor · IA Learning Path</title>
<style>
:root{--bg:#141310;--panel:#1e1c18;--ink:#f3efe4;--ink2:#b9b09c;--line:#34312a;--c:#d97757}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif}
.wrap{display:flex;flex-direction:column;height:100%;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}
.k{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
h1{font:600 20px/1.25 Georgia,serif;margin:4px 0 0;text-wrap:balance}
.act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button,a.b{display:inline-flex;align-items:center;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font:600 13.5px inherit;font-family:inherit;cursor:pointer;text-decoration:none;white-space:nowrap}
button.pri{background:var(--c);border-color:var(--c);color:#fff}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.ratio{position:relative;width:100%;max-height:100%;aspect-ratio:16/9;max-width:calc((100vh - 120px) * 16 / 9);background:#000;border-radius:4px;overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{color:var(--ink2);text-align:center}
@media (max-width:640px){header{flex-direction:column}.act{justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="k" id="meta">IA Learning Path</div><h1 id="ttl">Reproductor de clips</h1></div>
    <div class="act">
      <button type="button" class="pri" id="again">Repetir tramo</button>
      <button type="button" id="full">Pantalla completa</button>
      <a class="b" id="yt" href="#" target="_blank" rel="noopener">Abrir en YouTube</a>
    </div>
  </header>
  <div class="stage"><div class="ratio" id="box"><p class="empty" id="msg">Abre un clip desde la formación.</p></div></div>
</div>
<script>
const q=new URLSearchParams(location.hash.slice(1));
const id=(q.get("v")||"").replace(/[^\w-]/g,"").slice(0,11);
const s=Math.max(0,parseInt(q.get("s")||"0",10)||0);
const e=Math.max(0,parseInt(q.get("e")||"0",10)||0);
const t=q.get("t")||"";const c=q.get("c")||"";
const fmt=x=>{const h=Math.floor(x/3600),m=Math.floor(x%3600/60),r=x%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(r).padStart(2,"0")};
function load(){
  if(!id)return;
  const src="https://www.youtube-nocookie.com/embed/"+id+"?start="+s+(e>s?"&end="+e:"")+"&autoplay=1&rel=0&modestbranding=1&playsinline=1";
  const f=document.createElement("iframe");
  f.src=src;f.title=t||"Vídeo";f.referrerPolicy="strict-origin-when-cross-origin";
  f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";f.allowFullscreen=true;
  const box=document.getElementById("box");box.textContent="";box.appendChild(f);
}
if(id){
  document.title=(t||"Clip")+" · IA Learning Path";
  document.getElementById("ttl").textContent=t||"Clip";
  document.getElementById("meta").textContent=(c?c+" · ":"")+"tramo "+fmt(s)+(e>s?" → "+fmt(e):"");
  document.getElementById("yt").href="https://youtu.be/"+id+"?t="+s;
  load();
}
document.getElementById("again").onclick=load;
document.getElementById("full").onclick=()=>{const b=document.getElementById("box");(b.requestFullscreen||b.webkitRequestFullscreen||function(){}).call(b)};
window.addEventListener("hashchange",()=>location.reload());
</script>
</body>
</html>
