<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Reproductor · IA Learning Path</title>
<style>
:root{--bg:#141310;--panel:#1e1c18;--ink:#f3efe4;--ink2:#b9b09c;--line:#34312a;--c:#d97757}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif}
.wrap{display:flex;flex-direction:column;height:100%;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}
.k{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
h1{font:600 20px/1.25 Georgia,serif;margin:4px 0 0;text-wrap:balance}
.act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button,a.b{display:inline-flex;align-items:center;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font:600 13.5px inherit;font-family:inherit;cursor:pointer;text-decoration:none;white-space:nowrap}
button.pri{background:var(--c);border-color:var(--c);color:#fff}
#sound[hidden]{display:none}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.ratio{position:relative;width:100%;max-height:100%;aspect-ratio:16/9;max-width:calc((100vh - 120px) * 16 / 9);background:#000;border-radius:4px;overflow:hidden}
.ratio iframe,#yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{color:var(--ink2);text-align:center}
@media (max-width:640px){header{flex-direction:column}.act{justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="k" id="meta">IA Learning Path</div><h1 id="ttl">Reproductor de clips</h1></div>
    <div class="act">
      <button type="button" class="pri" id="sound" hidden>Reproducir con sonido</button>
      <button type="button" id="again">Repetir tramo</button>
      <button type="button" id="full">Pantalla completa</button>
      <a class="b" id="ytl" href="#" target="_blank" rel="noopener">Abrir en YouTube</a>
    </div>
  </header>
  <div class="stage"><div class="ratio" id="box"><div id="yt"><p class="empty">Abre un clip desde la formación.</p></div></div></div>
</div>
<script>
const q=new URLSearchParams(location.hash.slice(1));
const id=(q.get("v")||"").replace(/[^\w-]/g,"").slice(0,11);
const s=Math.max(0,parseInt(q.get("s")||"0",10)||0);
const e=Math.max(0,parseInt(q.get("e")||"0",10)||0);
const t=q.get("t")||"";const c=q.get("c")||"";
const fmt=x=>{const h=Math.floor(x/3600),m=Math.floor(x%3600/60),r=x%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(r).padStart(2,"0")};
const soundBtn=document.getElementById("sound");
let P=null,started=false;
function unmute(){if(P&&P.isMuted&&P.isMuted()){P.unMute();P.setVolume(100)}soundBtn.hidden=true}
function playSound(){if(P){P.unMute();P.setVolume(100);P.playVideo()}soundBtn.hidden=true}
// En Safari, YouTube pone el anuncio en silencio y el vídeo sigue mudo al terminar.
// Mientras dura el anuncio y los primeros segundos del clip, se vuelve a activar el sonido.
let keepSound=true,keepT=0;
setInterval(()=>{if(keepSound&&P&&P.isMuted&&P.isMuted()){P.unMute();P.setVolume(100)}},600);
function play(){if(!P)return;P.loadVideoById({videoId:id,startSeconds:s,endSeconds:e>s?e:undefined})}
window.onYouTubeIframeAPIReady=function(){
  P=new YT.Player("yt",{host:"https://www.youtube-nocookie.com",videoId:id,
    playerVars:{autoplay:1,start:s,end:e>s?e:undefined,rel:0,modestbranding:1,playsinline:1,origin:location.origin},
    events:{
      onReady:ev=>{ev.target.playVideo();
        // Nunca se silencia: un anuncio inicial no avisa de que está reproduciendo y el silencio se quedaba puesto.
        // Si el navegador no deja arrancar solo, aparece el botón para reproducir con sonido.
        setTimeout(()=>{const st=ev.target.getPlayerState();if(!started&&(st===-1||st===5))soundBtn.hidden=false},4000)},
      onStateChange:ev=>{if(ev.data===YT.PlayerState.PLAYING){started=true;if(!ev.target.isMuted())soundBtn.hidden=true;clearTimeout(keepT);keepT=setTimeout(()=>{if(P&&!P.isMuted())keepSound=false},8000)}}
    }});
};
if(id){
  document.title=(t||"Clip")+" · IA Learning Path";
  document.getElementById("ttl").textContent=t||"Clip";
  document.getElementById("meta").textContent=(c?c+" · ":"")+"tramo "+fmt(s)+(e>s?" → "+fmt(e):"");
  document.getElementById("ytl").href="https://youtu.be/"+id+"?t="+s;
  const tag=document.createElement("script");tag.src="https://www.youtube.com/iframe_api";document.head.appendChild(tag);
}
soundBtn.onclick=playSound;
// Cualquier clic o tecla en la página activa el sonido si el vídeo arrancó en silencio.
document.addEventListener("pointerdown",ev=>{if(!soundBtn.hidden&&ev.target!==soundBtn)playSound()});
document.addEventListener("keydown",()=>{if(!soundBtn.hidden)playSound()});
document.getElementById("again").onclick=()=>{keepSound=true;play();unmute()};
document.getElementById("full").onclick=()=>{const b=document.getElementById("box");(b.requestFullscreen||b.webkitRequestFullscreen||function(){}).call(b)};
window.addEventListener("hashchange",()=>location.reload());
</script>
</body>
</html>
